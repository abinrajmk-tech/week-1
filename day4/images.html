<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Responsive Images</title>
  </head>
  <body>
    <header>Responsive Images</header>
    <main>
      <img
        srcset="
          https://picsum.photos/id/237/400/400    400w,
          https://picsum.photos/id/237/800/800    800w,
          https://picsum.photos/id/237/1200/1200 1200w
        "
        sizes="(max-width: 600px) 100vw, (max-width: 1200px) 50vw, 33vw"
        src="https://picsum.photos/id/237/800/800"
        alt="image of a black dog"
        loading="eager"
      />
      <img
        srcset="
          https://picsum.photos/id/238/400/400    400w,
          https://picsum.photos/id/238/800/800    800w,
          https://picsum.photos/id/238/1200/1200 1200w
        "
        sizes="(max-width: 600px) 100vw, (max-width: 1200px) 50vw, 33vw"
        src="https://picsum.photos/id/238/800/800"
        alt="a city in black and white theme"
        loading="lazy"
      />
      <img
        srcset="
          https://picsum.photos/id/236/400/400    400w,
          https://picsum.photos/id/236/800/800    800w,
          https://picsum.photos/id/236/1200/1200 1200w
        "
        sizes="(max-width: 600px) 100vw, (max-width: 1200px) 50vw, 33vw"

      />

        srcset="
          https://picsum.photos/id/235/400/400    400w,
          https://picsum.photos/id/235/800/800    800w,
          https://picsum.photos/id/235/1200/1200 1200w
        "
        sizes="(max-width: 600px) 100vw, (max-width: 1200px) 50vw, 33vw"
        src="https://picsum.photos/id/235/800/800"
        alt="image of a mountain"
        loading="lazy"
      />
      <img
        srcset="
          https://picsum.photos/id/234/400/400    400w,
          https://picsum.photos/id/234/800/800    800w,
          https://picsum.photos/id/234/1200/1200 1200w
        "
        sizes="(max-width: 600px) 100vw, (max-width: 1200px) 50vw, 33vw"

          https://picsum.photos/id/233/400/400    400w,

        "

        src="https://picsum.photos/id/233/800/800"

        loading="lazy"
      />
      <img
        srcset="
          https://picsum.photos/id/232/400/400    400w,
          https://picsum.photos/id/232/800/800    800w,
          https://picsum.photos/id/232/1200/1200 1200w
        "
        sizes="(max-width: 600px) 100vw, (max-width: 1200px) 50vw, 33vw"
        src="https://picsum.photos/id/232/800/800"
        alt="a street lamp"
      />

        srcset="
          https://picsum.photos/id/231/400/400    400w,
          https://picsum.photos/id/231/800/800    800w,
          https://picsum.photos/id/231/1200/1200 1200w

      />

      <hr />
      <picture>
        <source
          media="(min-width: 800px)"
          srcset="https://picsum.photos/id/230/1920/1080"
        />
        <source
          media="(max-width: 799px)"
          srcset="https://picsum.photos/id/230/400/700"
        />
        <img src="https://picsum.photos/id/230/800/800" alt="a scenery" />
      </picture>

</html>
