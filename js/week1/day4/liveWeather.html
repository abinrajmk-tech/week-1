<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Live Weather Widget</title>

        <script src="liveWeather.js" defer></script>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap");
            * {
                padding: 0;
                margin: 0;
            }
            body {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                align-items: center;
                height: 100vh;
                gap: 30px;
                font-family: "Bubblegum Sans";
                background-color: #1b1b1b;
            }
            .container {
                display: none;
                position: relative;
                height: 400px;
                width: 800px;
                background: linear-gradient(-135deg, #1685cf, #47a9eb, #6fc5ff);
                box-shadow: 0 10px 30px #b7e2f1;
                color: white;
                border-radius: 32px;
                justify-content: space-between;
                padding: 24px 64px;
                margin-bottom: auto;
            }
            .skeleton {
                display: flex;
                position: relative;
                height: 400px;
                width: 800px;
                background: linear-gradient(
                    90deg,
                    #9cd1f5 25%,
                    #52b1f0 50%,
                    #9cd1f5 75%
                );
                box-shadow: 0 10px 30px #b7e2f1;
                color: white;
                border-radius: 32px;
                justify-content: space-between;
                padding: 24px 64px;
                /* background: linear-gradient(
                    90deg,
                    #f0f0f0 25%,
                    #e0e0e0 50%,
                    #f0f0f0 75%
                ); */
                background-size: 200% 100%;
                margin-bottom: auto;
                animation: loading 5s infinite linear;
            }
            @keyframes loading {
                0% {
                    background-position: 200% 0;
                }
                100% {
                    background-position: -200% 0;
                }
            }
            .data {
                display: flex;
                flex-direction: column;
                gap: 50px;
                /* justify-content: space-between; */
            }
            #time {
                font-size: 4em;
                font-weight: 500;
            }
            .date {
                font-size: 2em;
            }
            .wind {
                display: flex;
                gap: 8px;
                margin-top: auto;
                margin-bottom: 16px;
                padding: 5%;
                width: 300px;
                border-radius: 12px;
                background-color: rgb(255, 255, 255, 0.2);
                backdrop-filter: blur(20px);
            }
            .wind span {
                font-size: 2em;
            }
            .wind p {
                font-size: 1em;
            }
            .hourly {
                display: flex;
                gap: 12px;
            }
            .wmo {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
            }

            .wmo-status {
                font-size: 3em;
                font-weight: 600;
            }
            .temp {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-end;
            }
            .temp span {
                font-size: 2em;
                /* backdrop-filter:; */
            }
            #cloud {
                position: absolute;
                top: 0;
                right: 10px;
                height: 300px;
                width: 400px;
            }
            #temperature {
                color: white;
                font-size: 4em;
            }
            #search {
                flex-grow: 1;
                height: 100%;
                border: none;
                outline: none;
                border-radius: 12px;
                text-align: center;
            }
            .search {
                width: 500px;
                background-color: white;
                display: flex;
                padding: 2px 12px;
                margin-top: 3%;
                border-radius: 22px;
                height: 50px;
            }

            svg {
                fill: black;
            }
            button {
                background: none;
                border: none;
                outline: none;
            }
            button:hover svg,
            button:focus svg {
                fill: #47a9eb;
            }
            .main-container {
                margin-bottom: auto;
            }
        </style>
    </head>
    <body>
        <div class="search">
            <input
                type="text"
                id="search"
                name="search"
                placeholder="search here.."
            />
            <button>
                <svg
                    fill="#000000"
                    background="transparent"
                    height="24px"
                    width="24px"
                    version="1.1"
                    id="Capa_1"
                    xmlns="http://www.w3.org/2000/svg"
                    xmlns:xlink="http://www.w3.org/1999/xlink"
                    viewBox="0 0 53.627 53.627"
                    xml:space="preserve"
                >
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g
                        id="SVGRepo_tracerCarrier"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    ></g>
                    <g id="SVGRepo_iconCarrier">
                        <path
                            d="M53.627,49.385L37.795,33.553C40.423,30.046,42,25.709,42,21C42,9.42,32.58,0,21,0S0,9.42,0,21s9.42,21,21,21 c4.709,0,9.046-1.577,12.553-4.205l15.832,15.832L53.627,49.385z M2,21C2,10.523,10.523,2,21,2s19,8.523,19,19s-8.523,19-19,19 S2,31.477,2,21z M35.567,36.093c0.178-0.172,0.353-0.347,0.525-0.525c0.146-0.151,0.304-0.29,0.445-0.445l14.262,14.262 l-1.415,1.415L35.123,36.537C35.278,36.396,35.416,36.238,35.567,36.093z"
                        ></path>
                    </g>
                </svg>
            </button>
        </div>
        <div class="main-container">
            <div class="skeleton"></div>
            <div class="container">
                <div class="data">
                    <div class="today">
                        <div id="time">02:15</div>
                        <div class="date">FRI APR 5</div>
                    </div>
                    <div class="hourly">
                        <div class="wmo">
                            <div class="wmo-status">Cloudy</div>
                        </div>
                    </div>
                    <div class="wind">
                        <svg
                            width="32px"
                            height="32px"
                            viewBox="0 -1 28 28"
                            version="1.1"
                            xmlns="http://www.w3.org/2000/svg"
                            xmlns:xlink="http://www.w3.org/1999/xlink"
                            xmlns:sketch="http://www.bohemiancoding.com/sketch/ns"
                            fill="#000000"
                            stroke="#000000"
                        >
                            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                            <g
                                id="SVGRepo_tracerCarrier"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            ></g>
                            <g id="SVGRepo_iconCarrier">
                                <title>wind</title>
                                <desc>Created with Sketch Beta.</desc>
                                <defs></defs>
                                <g
                                    id="Page-1"
                                    stroke="none"
                                    stroke-width="1"
                                    fill="none"
                                    fill-rule="evenodd"
                                    sketch:type="MSPage"
                                >
                                    <g
                                        id="Icon-Set"
                                        sketch:type="MSLayerGroup"
                                        transform="translate(-466.000000, -830.000000)"
                                        fill="#ffffff"
                                    >
                                        <path
                                            d="M488,844 L467,844 C466.447,844 466,844.447 466,845 C466,845.553 466.447,846 467,846 L486.833,846 C489.687,846 492,847.791 492,850 C492,852.209 490.291,854 486,854 L486,856 L488,856 C491.313,856 494,853.313 494,850 C494,846.687 491.313,844 488,844 L488,844 Z M480.002,848 L480,848 L472,848 C471.447,848 471,848.448 471,849 C471,849.553 471.447,850 472,850 L480,850 C481.104,850 482,850.896 482,852 C482,853.104 481.104,854 480,854 L480,856 C482.209,856 484,854.209 484,852 C484,849.792 482.21,848.002 480.002,848 L480.002,848 Z M475,838 L487,838 C487.553,838 488,837.553 488,837 C488,836.448 487.553,836 487,836 L475,836 C474.447,836 474,836.448 474,837 C474,837.553 474.447,838 475,838 L475,838 Z M470,842 L488,842 C491.313,842 494,839.313 494,836 C494,832.687 491.313,830 488,830 L488,832 C490.822,832.531 492,833.791 492,836 C492,838.209 489.687,840 486.833,840 L470,840 C469.447,840 469,840.448 469,841 C469,841.553 469.447,842 470,842 L470,842 Z"
                                            sketch:type="MSShapeGroup"
                                        ></path>
                                    </g>
                                </g>
                            </g>
                        </svg>
                        <p><span id="wind">10 </span>km/h</p>
                    </div>
                </div>
                <div class="temp">
                    <div img-container>
                        <img src="./cloud.png" alt="" id="cloud" />
                    </div>
                    <p><span id="temperature">30&deg;</span>C</p>
                    <p class="wmo-status2">place,country</p>
                </div>
            </div>
        </div>
    </body>
</html>
