<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Drag and Drop Kanban Board</title>
        <style>
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .container {
                display: flex;
                justify-content: center;
                border: 2px solid black;
                height: 70vh;
                width: 90%;
                background-color: rgb(255, 238, 217);
            }
            .container div {
                display: flex;
                flex-direction: column;
                border: 2px solid black;
                width: 100%;
                text-align: center;
            }
            h1 {
                border-bottom: 1px solid black;
            }
            ul {
                list-style-type: none;
                padding: 5px;
            }
            li {
                font-size: 24px;
                margin: 4px 4px;
                background-color: rgb(112, 222, 255);

                /* padding: 4px; */
            }
            li:focus {
                border: 2px solid black;
            }

            .done li {
                background-color: green;
            }
            .inprogress li {
                background-color: orange;
            }
            .tasks {
                position: relative;
            }
            * {
                outline: none;
            }
            .bin {
                width: 90%;
                display: flex;
                justify-content: center;
                padding-top: 8px;
            }
            .add-btn {
                margin-top: auto;
                width: 50px;
                aspect-ratio: 1/1;
                justify-self: center;
                align-self: center;
                /* color: green; */
                font-size: 34px;
                background-color: transparent;
                border: 1px solid black;
                border-radius: 50%;
                margin-bottom: 16px;
            }
            .blank {
                border: 1px solid rebeccapurple;
                display: block;
                height: 30px;
                opacity: 0.4;
                /* width: 100%; */
                /* height: 100%; */
            }
            .add-btn:focus {
                background-color: green;
            }
        </style>
        <script src="kanban.js" defer type="module"></script>
    </head>
    <body>
        <h1>KANBAN</h1>
        <div class="container">
            <div class="todo tasks">
                <h1>Todo</h1>
                <ul class="task-list">
                    <li class="task" contenteditable="true" draggable="true">
                        Task 7
                    </li>
                </ul>
                <button class="add-btn">+</button>
            </div>
            <div class="inprogress tasks">
                <h1>In Progress</h1>
                <ul class="task-list">
                    <li class="task" contenteditable="true" draggable="true">
                        Touch Typing
                    </li>
                    <!-- <li class="blank"></li> -->
                </ul>
                <button class="add-btn">+</button>
            </div>
            <div class="done tasks">
                <h1>Done</h1>
                <ul class="task-list">
                    <li class="task" contenteditable="true" draggable="true">
                        Task 4
                    </li>
                    <li class="task" contenteditable="true" draggable="true">
                        Task 5
                    </li>
                    <li class="task" contenteditable="true" draggable="true">
                        Task 6
                    </li>
                </ul>
                <button class="add-btn">+</button>
            </div>
        </div>
        <div class="bin">
            <svg
                fill="#ff0000"
                height="40px"
                width="64px"
                version="1.1"
                id="Capa_1"
                xmlns="http://www.w3.org/2000/svg"
                xmlns:xlink="http://www.w3.org/1999/xlink"
                viewBox="0 0 307.252 307.252"
                xml:space="preserve"
                stroke="#ff0000"
            >
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g
                    id="SVGRepo_tracerCarrier"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                ></g>
                <g id="SVGRepo_iconCarrier">
                    <path
                        id="XMLID_564_"

            </svg>
        </div>
    </body>
</html>
