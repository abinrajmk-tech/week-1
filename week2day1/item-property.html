<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Item Property</title>
    <link rel="stylesheet" href="./item-property.css" />
    <style></style>
  </head>
  <body>
    <main>
      <div class="flex center align-items-flex-start">
        <div class="group-1">
          <h1>flex grow</h1>
          <div class="container flex">
            <div class="part-1 parts flex centre">0</div>
            <div class="part-2 parts flex centre">1</div>
            <div class="part-3 parts flex centre">2</div>
            <div class="part-4 parts flex centre">1</div>
          </div>
        </div>
        <div class="group-1">
          <h1>Flex shrink</h1>
          <div class="container-2 flex">
            <div class="shrink-1 flex centre">1</div>
            <div class="shrink-2 flex centre">1.5</div>
            <div class="shrink-3 flex centre">2</div>
          </div>
        </div>
      </div>
      <div class="flex center align-items-flex-start">
        <div class="group-1">
          <h1>flex basis</h1>
          <div class="container-3 flex">
            <div
              class="flex-0 flex centre"
              style="flex-basis: 200px; background: yellow"
            >
              200px
            </div>
            <div
              class="flex-1 flex centre"
              style="flex-basis: 33.33%; background: blue"
            >
              33.33%
            </div>
            <div
              class="flex-2 flex centre"
              style="flex-basis: 0; background: orange"
            >
              0
            </div>
            <div
              class="flex-3 flex centre"
              style="flex-basis: auto; background: rgb(255, 142, 142)"
            >
              Auto
            </div>
          </div>
        </div>
        <div class="group-1">
          <h1>order</h1>
          <div class="container-4 flex flex-basis-200px">
            <div
              class="flex centre"
              style="background: red; width: 10%; order: 5;"
            >
              1
            </div>
            <div
              class="flex centre"
              style="background: yellow; width: 10%; order: 4"
            >
              2
            </div>
            <div
              class="flex centre"
              style="background: green; width: 10%; order: 3"
            >
              3
            </div>
            <div
              class="flex centre"
              style="background: blue; width: 10%; order: 2"
            >
              4
            </div>
            <div
              class="flex centre"
              style="background: violet; width: 10%; order: 1"
            >
              5
            </div>
          </div>
        </div>
        
      </div>
      <div class="flex center align-items-flex-start">
        <div class="group-1">
          <h1>Align Self :flex-end (box 3)</h1>
          <div class="container-5">
            <div class="item-5">1</div>
            <div class="item-5">2</div>
            <div class="item-5" style="align-self:flex-end;">3</div>
            <div class="item-5">4</div>
            <div class="item-5">5</div>
            <div class="item-5">6</div>

          </div>

        </div>
 
        
      </div>
    </main>
  </body>
</html>
