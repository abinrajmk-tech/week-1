<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Line Based Placement & Spanning</title>
        <link rel="stylesheet" href="explicit-grid.css" />
    </head>
    <body>
        <h1>Line based Placement and spanning</h1>
        <h2>grid placement</h2>

        <div class="container container-1">
            <div class="item-1 item">(3,3)</div>
            <div class="item-2 item">(4,5)</div>
            <div class="item-3 item">1 / 3</div>
            <div class="item-4 item">span 2</div>
            <div class="item-5 item">span 3</div>
            <div class="item-6 item">2 /4</div>
            <div class="item-7 item">7</div>
            <div class="item-8 item">8</div>
        </div>
        <h2>grid-auto-flow : dense</h2>
        <div class="container container-2">
            <div class="itm-1 item">1</div>
            <div class="itm-2 item">2</div>
            <div class="itm-3 item">3</div>
            <div class="itm-4 item">4</div>
        </div>
    </body>
</html>
