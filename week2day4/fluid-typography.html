<!-- ​241.​
​Replace all fixed-size headings with clamp() values: h1: clamp(2.4rem, 5vw + 1rem, 5.6rem) -​
​verify it scales smoothly by dragging the browser window​
​242.​ ​Create a complete fluid type scale for h1–h6 and body using clamp() - minimum, preferred, and​
​maximum values for each​
​243.​ ​Use clamp() for fluid padding and gap spacing: padding: clamp(1rem, 3vw, 3rem)​
​244.​
​Use a container query: @ -->
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fluid Typography</title>
        <link rel="stylesheet" href="fluid-typography.css" />
    </head>
    <body>
        <h1>Heading 1</h1>
        <h2>Heading 2</h2>
        <h3>Heading 3</h3>
        <h4>Heading 4</h4>
        <h5>Heading 5</h5>
        <h6>Heading 6</h6>
        <div class="container">
            <div class="card">
                <li>1</li>
                <li>2</li>
                <li>3</li>
                <li>4</li>
            </div>
        </div>
    </body>
</html>
